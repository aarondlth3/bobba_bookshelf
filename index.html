<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf</title>
    
    <!-- Iconos y Favicon de la App -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/favicon.svg" />
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bookshelf" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        brand: { 50: '#fefce8', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#F0C732', 600: '#d97706', 700: '#b45309', 900: '#78350f' } 
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #F0C732; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: scaleIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { 
            from { opacity: 0; transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
        
        /* Dropdown Animation */
        .dropdown-enter { animation: slideDown 0.2s ease-out forwards; transform-origin: top; }
        @keyframes slideDown {
            from { opacity: 0; transform: scaleY(0.95); }
            to { opacity: 1; transform: scaleY(1); }
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen w-screen flex flex-col">

    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

        const API_URL = "https://script.google.com/macros/s/AKfycbwPkKnIYkt4RYa_IzhVcZ3W-7pB75Tr5IuZRsahT8I50i1kmtrz4s61ZIX56ZplPW3y/exec";
        const API_TOKEN = "bobba_bookshelf_secreto_2026";

        const ToastContext = createContext();
        const useToast = () => useContext(ToastContext);

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);
            const showToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3000);
            };
            return (
                <ToastContext.Provider value={showToast}>
                    {children}
                    <div className="fixed bottom-4 right-4 z-[999] flex flex-col gap-2">
                        {toasts.map(toast => {
                            const colors = { success: 'bg-green-50 text-green-800 border-green-200', error: 'bg-red-50 text-red-800 border-red-200', info: 'bg-blue-50 text-blue-800 border-blue-200' };
                            const icons = { success: 'ph-check-circle text-green-500', error: 'ph-warning-circle text-red-500', info: 'ph-info text-blue-500' };
                            return (
                                <div key={toast.id} className={`flex items-center gap-2 px-4 py-3 rounded-lg border shadow-sm text-sm font-medium transition-all duration-300 animate-[fadeIn_0.3s_ease-out] ${colors[toast.type]}`}>
                                    <i className={`ph ${icons[toast.type]} text-lg`}></i> <span>{toast.message}</span>
                                </div>
                            );
                        })}
                    </div>
                </ToastContext.Provider>
            );
        };

        const parseStringArray = (str) => {
            if (!str) return [];
            return str.split(';').map(s => s.trim()).filter(Boolean);
        };

        const getDriveImageUrl = (thumbnailId) => {
            if (!thumbnailId) return null;
            return `https://drive.google.com/thumbnail?id=${thumbnailId}&sz=w600`;
        };

        const getDirectDownloadLink = (link) => {
            if (!link) return '';
            if (link.includes('uc?export=')) return link;
            const match = link.match(/\/d\/(.+?)\//);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return link;
        };

        const MATERIAL_CONFIG = {
            'notion_link': { label: 'Apunte Notion (link)', icon: 'ph-notion-logo', action: 'open', color: 'text-slate-800', bg: 'bg-slate-100' },
            'md_zip': { label: 'Archivos markdown (.md)', icon: 'ph-file-md', action: 'download', color: 'text-amber-600', bg: 'bg-amber-50' },
            'txt_zip': { label: 'Archivos txt (.txt)', icon: 'ph-file-text', action: 'download', color: 'text-emerald-600', bg: 'bg-emerald-50' },
            'audio_drive_folder': { label: 'Audio Lessons (Carpeta)', icon: 'ph-headphones', action: 'open', color: 'text-purple-600', bg: 'bg-purple-50' },
            'aichat_link': { label: 'AI Chat', icon: 'ph-robot', action: 'open', color: 'text-indigo-600', bg: 'bg-indigo-50' },
            'notebookkm_link': { label: 'Cuaderno Notebook LM', icon: 'ph-notebook', action: 'open', color: 'text-blue-600', bg: 'bg-blue-50' },
            'other_link': { label: 'Otro', icon: 'ph-dots-three-circle', action: 'open', color: 'text-slate-500', bg: 'bg-slate-50' }
        };

        const ChipInput = ({ value, onChange, placeholder, icon }) => {
            const [inputValue, setInputValue] = useState('');
            const chips = useMemo(() => parseStringArray(value), [value]);

            const addChip = () => {
                if (inputValue.trim() && !chips.includes(inputValue.trim())) {
                    onChange([...chips, inputValue.trim()].join(';'));
                }
                setInputValue('');
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === ';' || e.key === ',') {
                    e.preventDefault(); addChip();
                } else if (e.key === 'Backspace' && inputValue === '' && chips.length > 0) {
                    removeChip(chips.length - 1);
                }
            };

            const removeChip = (index) => {
                onChange(chips.filter((_, i) => i !== index).join(';'));
            };

            return (
                <div className="flex flex-wrap items-center gap-2 p-2 border border-slate-300 rounded-xl bg-white focus-within:ring-2 focus-within:ring-brand-500 transition-shadow">
                    {icon && <i className={`ph ${icon} text-slate-400 ml-1`}></i>}
                    {chips.map((chip, idx) => (
                        <span key={idx} className="flex items-center gap-1 px-2.5 py-1 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg border border-slate-200">
                            {chip}
                            <button type="button" onClick={() => removeChip(idx)} className="text-slate-400 hover:text-red-500 rounded-full p-0.5"><i className="ph ph-x text-xs"></i></button>
                        </span>
                    ))}
                    <input type="text" value={inputValue} onChange={(e) => setInputValue(e.target.value)} onKeyDown={handleKeyDown} onBlur={addChip} placeholder={chips.length === 0 ? placeholder : "Añadir otro..."} className="flex-1 min-w-[120px] bg-transparent outline-none text-sm py-1 px-1" />
                </div>
            );
        };

        const ModalWrapper = ({ isOpen, onClose, title, children, maxWidth = "max-w-xl", zIndex = "z-50" }) => {
            if (!isOpen) return null;
            return (
                <div className={`fixed inset-0 ${zIndex} flex items-center justify-center p-4 sm:p-6`}>
                    <div className="absolute inset-0 bg-slate-900/50 backdrop-blur-sm modal-overlay" onClick={onClose}></div>
                    <div className={`relative bg-white rounded-2xl shadow-2xl w-full ${maxWidth} max-h-[90vh] flex flex-col modal-content overflow-hidden`}>
                        {title && (
                            <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-white z-10 sticky top-0">
                                <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                                <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700"><i className="ph ph-x text-lg"></i></button>
                            </div>
                        )}
                        <div className="overflow-y-auto flex-1 hide-scrollbar">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const ImageUploader = ({ imageState, onChange, label }) => {
            const fileInputRef = useRef(null);
            
            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        const max = 500;
                        if (width > height) { if (width > max) { height *= max / width; width = max; } } 
                        else { if (height > max) { width *= max / height; height = max; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        onChange({ preview: dataUrl, file, base64: dataUrl.split(',')[1], name: file.name });
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            return (
                <div className="flex flex-col items-center gap-3">
                    <div className="w-32 h-48 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden relative group cursor-pointer shadow-sm hover:border-brand-400 hover:bg-slate-50 transition-all" onClick={() => fileInputRef.current.click()}>
                        {imageState.preview ? (
                            <img src={imageState.preview} className="w-full h-full object-cover" alt="Preview" />
                        ) : (
                            <div className="text-center p-2">
                                <i className="ph ph-image text-3xl text-slate-400 mb-1 block"></i>
                                <span className="text-[10px] text-slate-500 uppercase tracking-wide font-semibold">{label || "Foto"}</span>
                            </div>
                        )}
                        <div className="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i className="ph ph-camera-plus text-white text-2xl"></i>
                        </div>
                    </div>
                    <input type="file" ref={fileInputRef} accept="image/*" className="hidden" onChange={handleImageChange} />
                </div>
            );
        };

        const AuthorFormModal = ({ isOpen, onClose, initialData, onSave, isSaving }) => {
            const [formData, setFormData] = useState({ name: '', nationality: '', lifespan: '', professions: '', career: '', biography: '', is_favorite: 'false' });
            const [image, setImage] = useState({ preview: null, file: null, base64: null, name: null });
            
            useEffect(() => {
                if (isOpen) {
                    if (initialData && initialData.isRegistered) {
                        setFormData({
                            name: initialData.name || '', nationality: initialData.nationality || '', lifespan: initialData.lifespan || '',
                            professions: initialData.professions || '', career: initialData.career || '', biography: initialData.biography || '',
                            is_favorite: initialData.is_favorite || 'false'
                        });
                        setImage({ preview: getDriveImageUrl(initialData.thumbnailId), file: null, base64: null, name: null });
                    } else {
                        // Pre-fill name if it comes from an auto-detected author
                        setFormData({ name: initialData?.name || '', nationality: '', lifespan: '', professions: '', career: '', biography: '', is_favorite: 'false' });
                        setImage({ preview: null, file: null, base64: null, name: null });
                    }
                }
            }, [isOpen, initialData]);

            const handleSubmit = (e) => {
                e.preventDefault();
                let payload = { ...formData, is_favorite: String(formData.is_favorite) };
                if (initialData?.author_id) payload.author_id = initialData.author_id;
                if (image.base64) { payload.imageBase64 = image.base64; payload.imageName = image.name; }
                if (initialData?.thumbnailId && !image.base64) { payload.thumbnailId = initialData.thumbnailId; }
                onSave(payload);
            };

            return (
                <ModalWrapper isOpen={isOpen} onClose={onClose} title={initialData?.isRegistered ? "Editar Autor" : "Completar Perfil de Autor"} zIndex="z-[60]" maxWidth="max-w-2xl">
                    <form onSubmit={handleSubmit} className="p-6">
                        <div className="flex flex-col md:flex-row gap-6 mb-6">
                            <div className="w-full md:w-1/3 flex flex-col items-center shrink-0">
                                <ImageUploader imageState={image} onChange={setImage} label="Foto del Autor" />
                                <div className="mt-4 w-full flex items-center justify-center gap-2">
                                    <label className="text-sm font-semibold text-slate-700">Favorito:</label>
                                    <button type="button" onClick={() => setFormData({...formData, is_favorite: formData.is_favorite === 'true' ? 'false' : 'true'})} className={`p-2 rounded-full transition-colors ${formData.is_favorite === 'true' ? 'text-yellow-500 bg-yellow-50' : 'text-slate-400 bg-slate-100 hover:bg-slate-200'}`}>
                                        <i className={`ph ${formData.is_favorite === 'true' ? 'ph-star-fill' : 'ph-star'} text-xl`}></i>
                                    </button>
                                </div>
                            </div>
                            <div className="flex-1 space-y-4">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Nombre del Autor *</label>
                                    <input type="text" required value={formData.name} onChange={e => setFormData({...formData, name: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Nacionalidad</label>
                                        <input type="text" value={formData.nationality} onChange={e => setFormData({...formData, nationality: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Ej: Escocés" />
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Años de vida</label>
                                        <input type="text" value={formData.lifespan} onChange={e => setFormData({...formData, lifespan: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Ej: 1892 - 1973" />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Profesiones</label>
                                    <ChipInput icon="ph-briefcase" value={formData.professions} onChange={val => setFormData({...formData, professions: val})} placeholder="Ej: Filósofo; Ensayista..." />
                                </div>
                            </div>
                        </div>

                        <div className="space-y-4 border-t border-slate-100 pt-4">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1.5">Trayectoria Laboral / Académica</label>
                                <textarea rows="2" value={formData.career} onChange={e => setFormData({...formData, career: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none resize-none" placeholder="Universidades, puestos importantes..."></textarea>
                            </div>
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1.5">Biografía Resumida</label>
                                <textarea rows="4" value={formData.biography} onChange={e => setFormData({...formData, biography: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none resize-none" placeholder="Párrafos sobre su vida y obra..."></textarea>
                            </div>
                        </div>

                        <div className="pt-6 flex justify-end gap-3 border-t border-slate-100 mt-6">
                            <button type="button" onClick={onClose} disabled={isSaving} className="px-5 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-medium">Cancelar</button>
                            <button type="submit" disabled={isSaving} className="px-6 py-2.5 bg-brand-500 text-slate-900 rounded-xl font-bold hover:bg-brand-600 flex items-center gap-2">
                                {isSaving ? <div className="loader border-t-slate-900 border-slate-900/30 w-4 h-4 border-2"></div> : 'Guardar Autor'}
                            </button>
                        </div>
                    </form>
                </ModalWrapper>
            );
        };

        const BookFormModal = ({ isOpen, onClose, initialData, onSave, isSaving }) => {
            const [formData, setFormData] = useState({ title: '', author: '', tags: '', description: '', thumbnailId: '' });
            const [image, setImage] = useState({ preview: null, file: null, base64: null, name: null });
            const showToast = useToast();

            useEffect(() => {
                if (isOpen) {
                    if (initialData) {
                        setFormData({
                            title: initialData.title || '', author: initialData.author || '', tags: initialData.tags || '',
                            description: initialData.description || '', thumbnailId: initialData.thumbnailId || ''
                        });
                        setImage({ preview: getDriveImageUrl(initialData.thumbnailId), file: null, base64: null, name: null });
                    } else {
                        setFormData({ title: '', author: '', tags: '', description: '', thumbnailId: '' });
                        setImage({ preview: null, file: null, base64: null, name: null });
                    }
                }
            }, [isOpen, initialData]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!formData.title) return showToast("El título es obligatorio", "error");
                const payload = { ...formData };
                if (initialData?.publication_id) payload.publication_id = initialData.publication_id;
                if (image.base64) { payload.imageBase64 = image.base64; payload.imageName = image.name; }
                onSave(payload);
            };

            return (
                <ModalWrapper isOpen={isOpen} onClose={onClose} title={initialData ? "Editar Libro" : "Añadir Libro"} zIndex="z-[60]">
                    <form onSubmit={handleSubmit} className="p-6 space-y-5">
                        <ImageUploader imageState={image} onChange={setImage} label="Portada" />
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Título *</label>
                            <input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Autor(es) *</label>
                            <ChipInput icon="ph-user" value={formData.author} onChange={val => setFormData({...formData, author: val})} placeholder="Ej: J.R.R. Tolkien..." />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Géneros / Etiquetas *</label>
                            <ChipInput icon="ph-tag" value={formData.tags} onChange={val => setFormData({...formData, tags: val})} placeholder="Ej: Fantasía..." />
                        </div>
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Descripción</label>
                            <textarea rows="3" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none resize-none"></textarea>
                        </div>
                        
                        <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                            <button type="button" onClick={onClose} disabled={isSaving} className="px-5 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-medium">Cancelar</button>
                            <button type="submit" disabled={isSaving} className="px-6 py-2.5 bg-brand-500 text-slate-900 rounded-xl font-bold hover:bg-brand-600 flex items-center gap-2">
                                {isSaving ? <><div className="loader border-t-slate-900 border-slate-900/30 w-4 h-4 border-2"></div> Guardando</> : 'Guardar Libro'}
                            </button>
                        </div>
                    </form>
                </ModalWrapper>
            );
        };

        const ItemFormModal = ({ isOpen, onClose, type, parentId, initialData, onSave, isSaving }) => {
            const [formData, setFormData] = useState({});
            
            useEffect(() => {
                if (isOpen) {
                    if (initialData) setFormData({ ...initialData });
                    else {
                        if (type === 'version') setFormData({ language: 'Español', format: 'PDF', file_drive_link: '', isbn: '', publication_date: '', edition_number: '', edition_year: '', publisher: '' });
                        else setFormData({ material_type: 'other_link', material_title: '', link: '', description: '' });
                    }
                }
            }, [isOpen, initialData, type]);

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ ...formData, publication_id: parentId });
            };

            const isV = type === 'version';

            return (
                <ModalWrapper isOpen={isOpen} onClose={onClose} title={initialData ? `Editar ${isV ? 'Versión' : 'Recurso'}` : `Añadir ${isV ? 'Versión' : 'Recurso'}`} zIndex="z-[60]" maxWidth="max-w-xl">
                    <form onSubmit={handleSubmit} className="p-6 space-y-4">
                        {isV ? (
                            <>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Idioma *</label>
                                        <select value={formData.language || 'Español'} onChange={e => setFormData({...formData, language: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                                            <option value="Español">Español</option><option value="Inglés">Inglés</option>
                                            <option value="Francés">Francés</option><option value="Otros">Otros</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Formato *</label>
                                        <select value={formData.format || 'PDF'} onChange={e => setFormData({...formData, format: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl outline-none">
                                            <option value="PDF">PDF</option><option value="EPUB">EPUB</option>
                                            <option value="MOBI">MOBI</option><option value="ZIP">ZIP</option><option value="Físico">Físico</option>
                                        </select>
                                    </div>
                                </div>
                                
                                <div className="grid grid-cols-3 gap-4">
                                    <div className="col-span-1">

                try {
                    const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'getAllData', token: API_TOKEN }) });
                    const json = await res.json();
                    if (json.status === 'error') throw new Error(json.message);
                    setData({
                        publications: json.data.publications || [], versions: json.data.versions || [],
                        materials: json.data.materials || [], projects: json.data.projects || [], authors: json.data.authors || []
                    });
                } catch (error) { showToast(error.message, 'error'); } finally { setIsLoading(false); }
            };

            const apiCall = async (action, payload = {}) => {
                const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, token: API_TOKEN, ...payload }) });
                const json = await res.json();
                if (json.status === 'error') throw new Error(json.message);
                return json.data;
            };

            // Entity Saves
            const handleSaveBook = async (payload) => {
                setBookForm(prev => ({...prev, saving: true}));
                const isNew = !payload.publication_id;
                try {
                    const action = isNew ? 'createPublication' : 'updatePublication';
                    const res = await apiCall(action, { data: payload });
                    showToast("Libro guardado", "success");
                    setBookForm({ open: false, data: null, saving: false });
                    await fetchData(true);
                    if(isNew && res.publication_id) setDetailModal({ open: true, id: res.publication_id });
                } catch(e) { showToast(e.message, 'error'); setBookForm(prev => ({...prev, saving: false})); }
            };

            const handleSaveProject = async (payload) => {
                setProjectForm(prev => ({...prev, saving: true}));
                try {
                    const action = payload.project_id ? 'updateProject' : 'createProject';
                    await apiCall(action, { data: payload });
                    showToast("Proyecto guardado", "success");
                    if (activeProject && payload.project_id === activeProject.project_id) setActiveProject({ ...activeProject, ...payload });
                    setProjectForm({ open: false, data: null, saving: false });
                    fetchData(true);
                } catch(e) { showToast(e.message, 'error'); setProjectForm(prev => ({...prev, saving: false})); }
            };
            
            const handleSaveAuthor = async (payload) => {
                setAuthorForm(prev => ({...prev, saving: true}));
                try {
                    const action = payload.author_id ? 'updateAuthor' : 'createAuthor';
                    await apiCall(action, { data: payload });
                    showToast("Autor guardado", "success");
                    setAuthorForm({ open: false, data: null, saving: false });
                    fetchData(true);
                } catch(e) { showToast(e.message, 'error'); setAuthorForm(prev => ({...prev, saving: false})); }
            };

            const handleSaveItem = async (payload) => {
                setItemForm(prev => ({...prev, saving: true}));
                const isV = itemForm.type === 'version';
                const actionName = itemForm.data ? `update${isV?'Version':'Material'}` : `create${isV?'Version':'Material'}`;
                try {
                    await apiCall(actionName, { data: payload });
                    showToast("Guardado", "success");
                    setItemForm({ open: false, type: 'version', parentId: null, data: null, saving: false });
                    fetchData(true);
                } catch(e) { showToast(e.message, 'error'); setItemForm(prev => ({...prev, saving: false})); }
            };

            // Deletions & Toggles
            const handleDeleteBook = async (id) => {
                if(!confirm("¿Eliminar este libro?")) return;
                setDetailModal({ open: false, id: null });
                try { await apiCall('deletePublication', { id }); showToast("Libro eliminado", "success"); fetchData(true); } catch(e) { showToast(e.message, 'error'); }
            };
            
            const handleToggleArchiveProject = async (project) => {
                const newStatus = project.status === 'archived' ? 'active' : 'archived';
                if(!confirm(`¿${newStatus === 'archived' ? 'Archivar' : 'Restaurar'} este proyecto?`)) return;
                setActiveProject(null); 
                try { await apiCall('updateProject', { data: { project_id: project.project_id, status: newStatus } }); fetchData(true); } catch(e) { showToast(e.message, 'error'); }
            };

            const handleDeleteItem = async (type, id) => {
                if(!confirm("¿Eliminar este elemento?")) return;
                try { await apiCall(type === 'version' ? 'deleteVersion' : 'deleteMaterial', { id }); fetchData(true); } catch(e) { showToast(e.message, 'error'); }
            };

            const allAvailableTags = useMemo(() => {
                const tagSet = new Set();
                if (view === 'library' || activeProject) data.publications.forEach(p => parseStringArray(p.tags).forEach(t => tagSet.add(t)));
                else if (view === 'projects') data.projects.forEach(p => parseStringArray(p.tags).forEach(t => tagSet.add(t)));
                return Array.from(tagSet).sort();
            }, [data.publications, data.projects, view, activeProject]);

            const filteredPublications = useMemo(() => {
                let list = data.publications;
                if (activeProject) {
                    const pIds = activeProject.publication_ids ? activeProject.publication_ids.split(',') : [];
                    list = list.filter(p => pIds.includes(p.publication_id));
                }
                if (search.trim()) {
                    const q = search.toLowerCase();
                    list = list.filter(p => (p.title||'').toLowerCase().includes(q) || (p.author||'').toLowerCase().includes(q));
                }
                if (selectedTags.length > 0) {
                    list = list.filter(p => {
                        const pTags = parseStringArray(p.tags);
                        return selectedTags.every(st => pTags.includes(st));
                    });
                }
                return list;
            }, [data.publications, search, selectedTags, activeProject]);
            
            // Authors computed data
            const authorsList = useMemo(() => {
                const namesFromBooks = new Set();
                data.publications.forEach(p => parseStringArray(p.author).forEach(a => namesFromBooks.add(a)));
                
                const result = [];
                namesFromBooks.forEach(name => {
                    const existing = data.authors.find(a => a.name.toLowerCase() === name.toLowerCase());
                    if (existing) {
                        result.push({ ...existing, isRegistered: true });
                    } else {
                        result.push({ name, isRegistered: false, is_favorite: 'false' });
                    }
                });
                return result.sort((a,b) => a.name.localeCompare(b.name));
            }, [data.publications, data.authors]);

            const navigate = (newView) => {
                setView(newView);
                setActiveProject(null);
                setSearch('');
                setSelectedTags([]);
                setIsMobileMenuOpen(false);
            };

            return (
                <>
                    <header className="bg-white border-b border-slate-200 shrink-0 z-40 relative shadow-sm">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-8">
                                <div className="flex items-center gap-2 cursor-pointer shrink-0" onClick={() => navigate('library')}>
                                    <img src="https://raw.githubusercontent.com/aarondlth3/bobba_bookshelf/07297969d12577f03fab52d59711c7cc3000bd1b/images/bookshelf_img.png" alt="Logo" className="h-10 w-auto object-contain" />
                                </div>
                                <nav className="hidden md:flex gap-6">
                                    <button onClick={() => navigate('library')} className={`text-sm font-semibold transition-colors flex items-center gap-2 ${view === 'library' && !activeProject ? 'text-brand-600 border-b-2 border-brand-500 pb-1 translate-y-[2px]' : 'text-slate-500 hover:text-slate-800'}`}><i className="ph ph-books"></i> Biblioteca</button>
                                    <button onClick={() => navigate('projects')} className={`text-sm font-semibold transition-colors flex items-center gap-2 ${view === 'projects' || activeProject ? 'text-brand-600 border-b-2 border-brand-500 pb-1 translate-y-[2px]' : 'text-slate-500 hover:text-slate-800'}`}><i className="ph ph-folders"></i> Proyectos</button>
                                    <button onClick={() => navigate('authors')} className={`text-sm font-semibold transition-colors flex items-center gap-2 ${view === 'authors' ? 'text-brand-600 border-b-2 border-brand-500 pb-1 translate-y-[2px]' : 'text-slate-500 hover:text-slate-800'}`}><i className="ph ph-users"></i> Autores</button>
                                </nav>
                            </div>
                            <div className="flex items-center gap-3">
                                <button onClick={() => { setBookForm({ open: true, data: null, saving: false }); setIsMobileMenuOpen(false); }} className="hidden sm:flex bg-brand-500 hover:bg-brand-600 text-slate-900 px-4 py-2 rounded-xl text-sm font-bold transition-all items-center gap-2 shadow-sm transform hover:scale-105">
                                    <i className="ph ph-plus-circle text-lg"></i> Nuevo Libro
                                </button>
                                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="md:hidden w-10 h-10 flex items-center justify-center text-slate-700 bg-slate-100 hover:bg-slate-200 rounded-xl transition-colors">
                                    <i className={`ph ${isMobileMenuOpen ? 'ph-x' : 'ph-list'} text-xl`}></i>
                                </button>
                            </div>
                        </div>
                        
                        {/* Mobile Menu Dropdown */}
                        {isMobileMenuOpen && (
                            <div className="md:hidden absolute top-16 left-0 w-full bg-white border-b border-slate-200 shadow-xl dropdown-enter z-50 flex flex-col p-4 gap-2">
                                <button onClick={() => navigate('library')} className={`p-3 rounded-xl flex items-center gap-3 text-left font-semibold ${view === 'library' ? 'bg-brand-50 text-brand-700' : 'text-slate-600'}`}><i className="ph ph-books text-xl"></i> Biblioteca</button>
                                <button onClick={() => navigate('projects')} className={`p-3 rounded-xl flex items-center gap-3 text-left font-semibold ${view === 'projects' ? 'bg-brand-50 text-brand-700' : 'text-slate-600'}`}><i className="ph ph-folders text-xl"></i> Proyectos</button>
                                <button onClick={() => navigate('authors')} className={`p-3 rounded-xl flex items-center gap-3 text-left font-semibold ${view === 'authors' ? 'bg-brand-50 text-brand-700' : 'text-slate-600'}`}><i className="ph ph-users text-xl"></i> Autores</button>
                                <div className="h-px bg-slate-100 my-2"></div>
                                <button onClick={() => { setBookForm({ open: true, data: null, saving: false }); setIsMobileMenuOpen(false); }} className="p-3 bg-brand-500 text-slate-900 rounded-xl font-bold flex items-center justify-center gap-2"><i className="ph ph-plus-circle text-xl"></i> Nuevo Libro</button>
                            </div>
                        )}
                    </header>

                    <main className="flex-1 overflow-y-auto w-full relative bg-slate-50/50">
                        {isLoading && (
                            <div className="absolute inset-0 flex flex-col items-center justify-center bg-slate-50/80 backdrop-blur-sm z-30">
                                <div className="loader border-t-brand-600 border-slate-200 w-12 h-12 border-4 mb-4"></div>
                                <p className="text-slate-600 font-semibold animate-pulse">Cargando...</p>
                            </div>
                        )}

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 h-full flex flex-col">
                            
                            {/* --- VIEW: LIBRARY / ACTIVE PROJECT --- */}
                            {(view === 'library' || activeProject) && (
                                <div className="flex-1 flex flex-col">
                                    {activeProject && (
                                        <div className="mb-6 p-6 bg-white border border-slate-200 rounded-2xl shadow-sm relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-1.5 h-full bg-brand-500"></div>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <button onClick={() => navigate('projects')} className="text-slate-400 hover:text-brand-600 text-sm font-medium flex items-center gap-1 mb-2"><i className="ph ph-arrow-left"></i> Volver a proyectos</button>
                                                    <div className="flex items-center gap-3 mb-1">
                                                        <h2 className="text-3xl font-black text-slate-900">{activeProject.title}</h2>
                                                        {activeProject.status === 'archived' && <span className="px-2.5 py-1 bg-slate-200 text-slate-600 text-xs font-bold rounded-md flex items-center gap-1"><i className="ph ph-archive"></i> Archivado</span>}
                                                    </div>
                                                    {activeProject.description && <p className="text-slate-500 max-w-2xl">{activeProject.description}</p>}
                                                </div>
                                                <div className="flex flex-col sm:flex-row gap-2">
                                                    <button onClick={() => handleToggleArchiveProject(activeProject)} className="px-3 py-2 text-slate-500 hover:text-slate-800 bg-slate-50 hover:bg-slate-200 rounded-lg font-medium text-sm flex items-center gap-2">
                                                        <i className={`ph ${activeProject.status === 'archived' ? 'ph-arrow-u-up-left' : 'ph-archive'} text-lg`}></i> 
                                                        <span className="hidden sm:inline">{activeProject.status === 'archived' ? 'Restaurar' : 'Archivar'}</span>
                                                    </button>
                                                    <button onClick={() => setProjectForm({ open: true, data: activeProject, saving: false })} className="p-2 text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 rounded-lg"><i className="ph ph-pencil-simple text-lg"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    <div className="flex flex-col sm:flex-row gap-4 mb-6 shrink-0">
                                        <div className="relative flex-1">
                                            <i className="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
                                            <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar libros..." className="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-500 outline-none shadow-sm font-medium" />
                                        </div>
                                        <button onClick={() => setShowTags(!showTags)} className={`px-5 py-3 rounded-2xl font-bold flex items-center justify-center gap-2 transition-all border shadow-sm ${showTags ? 'bg-brand-500 text-slate-900 border-brand-600' : 'bg-white text-slate-700 hover:bg-slate-50'}`}>
                                            <i className="ph ph-funnel text-xl"></i> <span className="hidden sm:inline">Explorar</span>
                                        </button>
                                    </div>

                                    {showTags && allAvailableTags.length > 0 && (
                                        <div className="flex flex-wrap gap-2 mb-8 shrink-0 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm animate-[fadeIn_0.2s_ease-out]">
                                            <div className="w-full mb-2 text-sm font-bold text-slate-500 flex items-center gap-2"><i className="ph ph-tag"></i> Filtrar por etiquetas:</div>
                                            {allAvailableTags.map(tag => {
                                                const isActive = selectedTags.includes(tag);
                                                return (
                                                    <button key={tag} onClick={() => setSelectedTags(prev => isActive ? prev.filter(t => t !== tag) : [...prev, tag])}
                                                        className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all border ${isActive ? 'bg-brand-500 text-slate-900 border-brand-600 shadow-md' : 'bg-slate-50 text-slate-600 hover:border-brand-300'}`}>
                                                        {tag}
                                                    </button>
                                                )
                                            })}
                                            {selectedTags.length > 0 && <button onClick={() => setSelectedTags([])} className="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-slate-600 underline ml-2">Limpiar</button>}
                                        </div>
                                    )}

                                    {filteredPublications.length === 0 ? (
                                        <div className="flex-1 flex flex-col items-center justify-center text-center py-20">
                                            <i className="ph ph-books text-6xl text-slate-300 mb-4 block"></i>
                                            <h3 className="text-xl font-bold text-slate-800 mb-2">No se encontraron libros</h3>
                                            <p className="text-slate-500">Ajusta tu búsqueda o añade nuevos libros.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6 pb-10">
                                            {filteredPublications.map(pub => {
                                                const imgSrc = getDriveImageUrl(pub.thumbnailId) || `https://ui-avatars.com/api/?name=${encodeURIComponent(pub.title)}&background=f1f5f9&color=64748b&size=400`;
                                                const bookMaterials = data.materials.filter(m => m.publication_id === pub.publication_id);
                                                const uniqueTypes = [...new Set(bookMaterials.map(m => m.material_type))];

                                                return (
                                                    <div key={pub.publication_id} onClick={() => setDetailModal({ open: true, id: pub.publication_id })} className="bg-slate-200 rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-2xl hover:border-brand-300 transition-all duration-300 cursor-pointer relative group aspect-[2/3]">
                                                        <img src={imgSrc} className="w-full h-full object-cover" alt={pub.title} />
                                                        {uniqueTypes.length > 0 && (
                                                            <div className="absolute top-2 right-2 flex flex-col gap-1.5 z-10">
                                                                {uniqueTypes.map(type => {
                                                                    const conf = MATERIAL_CONFIG[type] || MATERIAL_CONFIG['other_link'];
                                                                    return <div key={type} className={`w-7 h-7 rounded-full flex items-center justify-center bg-white/95 shadow-md backdrop-blur-sm ${conf.color}`} title={conf.label}><i className={`ph ${conf.icon} text-lg`}></i></div>
                                                                })}
                                                            </div>
                                                        )}
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/90 via-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex flex-col justify-end p-4">
                                                            <h4 className="text-white font-bold leading-tight mb-1 truncate">{pub.title}</h4>
                                                            <p className="text-slate-300 text-xs truncate">{parseStringArray(pub.author).join(', ')}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* --- VIEW: PROJECTS --- */}
                            {view === 'projects' && !activeProject && (
                                <div className="flex-1">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-3xl font-black text-slate-900">Proyectos</h2>
                                        <button onClick={() => setProjectForm({ open: true, data: null, saving: false })} className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center gap-2"><i className="ph ph-folder-plus"></i><span className="hidden sm:inline">Nuevo Proyecto</span></button>
                                    </div>
                                    
                                    <div className="flex border-b border-slate-200 mb-6">
                                        <button onClick={() => setProjectTab('active')} className={`px-5 py-3 font-semibold text-sm flex items-center gap-2 border-b-2 ${projectTab === 'active' ? 'border-brand-500 text-brand-600' : 'border-transparent text-slate-500'}`}><i className="ph ph-folders"></i> Activos</button>
                                        <button onClick={() => setProjectTab('archived')} className={`px-5 py-3 font-semibold text-sm flex items-center gap-2 border-b-2 ${projectTab === 'archived' ? 'border-brand-500 text-brand-600' : 'border-transparent text-slate-500'}`}><i className="ph ph-archive"></i> Archivados</button>
                                    </div>

                                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
                                        {data.projects.filter(p => (p.status || 'active') === projectTab).map(proj => {
                                            const tags = parseStringArray(proj.tags);
                                            return (
                                                <div key={proj.project_id} onClick={() => setActiveProject(proj)} className="bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-xl hover:border-brand-400 cursor-pointer group">
                                                    <div className="flex items-center gap-3 mb-4">
                                                        <div className={`w-12 h-12 rounded-xl text-white flex items-center justify-center shrink-0 ${proj.status==='archived'?'bg-slate-400':'bg-slate-800'}`}><i className={`ph ${proj.status==='archived'?'ph-archive':'ph-folder-open'} text-2xl`}></i></div>
                                                        <div>
                                                            <h3 className="font-bold text-lg text-slate-900">{proj.title}</h3>
                                                            <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">{(proj.publication_ids?.split(',').filter(Boolean)||[]).length} Libros</span>
                                                        </div>
                                                    </div>
                                                    {tags.length > 0 && <div className="flex flex-wrap gap-1.5 mb-3">{tags.map((t,i) => <span key={i} className="px-2 py-0.5 bg-brand-50 text-brand-800 text-[10px] font-bold rounded border border-brand-100">{t}</span>)}</div>}
                                                    <p className="text-sm text-slate-500 line-clamp-2">{proj.description}</p>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            )}

                            {/* --- VIEW: AUTHORS --- */}
                            {view === 'authors' && (
                                <div className="flex-1">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-3xl font-black text-slate-900">Enciclopedia de Autores</h2>
                                    </div>
                                    
                                    <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 pb-10">
                                        {/* Favorites Section */}
                                        {authorsList.filter(a => a.is_favorite === 'true').length > 0 && (
                                            <div className="col-span-full border-b border-slate-200 pb-4 mb-2">
                                                <h3 className="font-bold text-slate-500 text-sm flex items-center gap-2 uppercase tracking-wider"><i className="ph ph-star-fill text-yellow-500"></i> Favoritos</h3>
                                            </div>
                                        )}
                                        {authorsList.map((author, index) => {
                                            const isFav = author.is_favorite === 'true';
                                            const hasInfo = author.isRegistered;
                                            const imgSrc = getDriveImageUrl(author.thumbnailId) || `https://ui-avatars.com/api/?name=${encodeURIComponent(author.name)}&background=f1f5f9&color=64748b`;
                                            
                                            return (
                                                <div key={index} onClick={() => setAuthorForm({ open: true, data: author, saving: false })} className={`bg-white rounded-2xl border ${hasInfo ? 'border-slate-200 hover:border-brand-400 hover:shadow-lg' : 'border-dashed border-slate-300 opacity-70 hover:opacity-100'} p-5 flex flex-col items-center text-center cursor-pointer transition-all`}>
                                                    <div className="relative w-24 h-24 mb-4">
                                                        <img src={imgSrc} className="w-full h-full object-cover rounded-full shadow-sm border-2 border-white" alt={author.name} />
                                                        {isFav && <div className="absolute bottom-0 right-0 w-6 h-6 bg-yellow-400 rounded-full border-2 border-white flex items-center justify-center text-white"><i className="ph ph-star-fill text-[10px]"></i></div>}
                                                    </div>
                                                    <h4 className="font-bold text-slate-900 mb-1">{author.name}</h4>
                                                    {hasInfo ? (
                                                        <>
                                                            <p className="text-xs text-slate-500 font-medium">{author.nationality || 'Sin nacionalidad'} • {author.lifespan || '?'}</p>
                                                            <div className="flex flex-wrap justify-center gap-1 mt-3">
                                                                {parseStringArray(author.professions).slice(0,2).map((p,i) => <span key={i} className="text-[9px] font-bold bg-slate-100 text-slate-600 px-2 py-0.5 rounded">{p}</span>)}
                                                            </div>
                                                        </>
                                                    ) : (
                                                        <span className="text-xs font-semibold text-brand-600 bg-brand-50 px-2 py-1 rounded-md mt-2"><i className="ph ph-plus"></i> Completar Perfil</span>
                                                    )}
                                                </div>
                                            )
                                        })}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* Modals Mounting */}
                    <BookFormModal isOpen={bookForm.open} initialData={bookForm.data} isSaving={bookForm.saving} onClose={() => setBookForm({ open: false, data: null, saving: false })} onSave={handleSaveBook} />
                    <ProjectFormModal isOpen={projectForm.open} initialData={projectForm.data} isSaving={projectForm.saving} allPublications={data.publications} onClose={() => setProjectForm({ open: false, data: null, saving: false })} onSave={handleSaveProject} />
                    <ItemFormModal isOpen={itemForm.open} type={itemForm.type} parentId={itemForm.parentId} initialData={itemForm.data} isSaving={itemForm.saving} onClose={() => setItemForm({ open: false, type: 'version', parentId: null, data: null, saving: false })} onSave={handleSaveItem} />
                    <AuthorFormModal isOpen={authorForm.open} initialData={authorForm.data} isSaving={authorForm.saving} onClose={() => setAuthorForm({ open: false, data: null, saving: false })} onSave={handleSaveAuthor} />
                    
                    <BookDetailModal isOpen={detailModal.open} book={data.publications.find(p => p.publication_id === detailModal.id)} versions={data.versions.filter(v => v.publication_id === detailModal.id)} materials={data.materials.filter(m => m.publication_id === detailModal.id)} onClose={() => setDetailModal({ open: false, id: null })} onEdit={(b) => setBookForm({ open: true, data: b, saving: false })} onDelete={handleDeleteBook} onOpenItemForm={(type, initial, parentId) => setItemForm({ open: true, type, data: initial, parentId, saving: false })} onDeleteItem={handleDeleteItem} />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ToastProvider><App /></ToastProvider>);
    </script>
</body>
</html>
