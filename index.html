<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bookshelf</title>
    
    <!-- Iconos y Favicon de la App -->
    <link rel="icon" type="image/png" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/favicon.svg" />
    <link rel="shortcut icon" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Bookshelf" />
    <link rel="manifest" href="https://cdn.jsdelivr.net/gh/aarondlth3/bobba_bookshelf@main/images/site.webmanifest" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { 
                        brand: { 50: '#fefce8', 100: '#fef3c7', 200: '#fde68a', 300: '#fcd34d', 400: '#fbbf24', 500: '#F0C732', 600: '#d97706', 700: '#b45309', 900: '#78350f' } 
                    }
                }
            }
        }
    </script>

    <!-- Google Fonts & Phosphor Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- React 18 & Babel CDN -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow: hidden; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #F0C732; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* Modal Animations */
        .modal-overlay { animation: fadeIn 0.2s ease-out forwards; }
        .modal-content { animation: scaleIn 0.2s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes scaleIn { 
            from { opacity: 0; transform: scale(0.95) translateY(10px); } 
            to { opacity: 1; transform: scale(1) translateY(0); } 
        }
    </style>
</head>
<body class="text-slate-800 antialiased h-screen w-screen flex flex-col">

    <div id="root" class="h-full w-full flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, createContext, useContext } = React;

        // --- CONFIGURACIÓN DE LA API ---
        const API_URL = "https://script.google.com/macros/s/AKfycbwPkKnIYkt4RYa_IzhVcZ3W-7pB75Tr5IuZRsahT8I50i1kmtrz4s61ZIX56ZplPW3y/exec";
        const API_TOKEN = "bobba_bookshelf_secreto_2026";

        // --- CONTEXTO DE TOAST (NOTIFICACIONES) ---
        const ToastContext = createContext();
        const useToast = () => useContext(ToastContext);

        const ToastProvider = ({ children }) => {
            const [toasts, setToasts] = useState([]);

            const showToast = (message, type = 'info') => {
                const id = Date.now();
                setToasts(prev => [...prev, { id, message, type }]);
                setTimeout(() => {
                    setToasts(prev => prev.filter(t => t.id !== id));
                }, 3000);
            };

            return (
                <ToastContext.Provider value={showToast}>
                    {children}
                    <div className="fixed bottom-4 right-4 z-[999] flex flex-col gap-2">
                        {toasts.map(toast => {
                            const colors = {
                                success: 'bg-green-50 text-green-800 border-green-200',
                                error: 'bg-red-50 text-red-800 border-red-200',
                                info: 'bg-blue-50 text-blue-800 border-blue-200'
                            };
                            const icons = {
                                success: 'ph-check-circle text-green-500',
                                error: 'ph-warning-circle text-red-500',
                                info: 'ph-info text-blue-500'
                            };
                            return (
                                <div key={toast.id} className={`flex items-center gap-2 px-4 py-3 rounded-lg border shadow-sm text-sm font-medium transition-all duration-300 animate-[fadeIn_0.3s_ease-out] ${colors[toast.type]}`}>
                                    <i className={`ph ${icons[toast.type]} text-lg`}></i> <span>{toast.message}</span>
                                </div>
                            );
                        })}
                    </div>
                </ToastContext.Provider>
            );
        };

        
        // Chip Input for Authors and Tags
        const ChipInput = ({ value, onChange, placeholder, icon }) => {
            const [inputValue, setInputValue] = useState('');
            const chips = useMemo(() => value ? value.split(';').map(s => s.trim()).filter(Boolean) : [], [value]);

            const addChip = () => {
                if (inputValue.trim() && !chips.includes(inputValue.trim())) {
                    const newChips = [...chips, inputValue.trim()];
                    onChange(newChips.join(';'));
                }
                setInputValue('');
            };

            const handleKeyDown = (e) => {
                if (e.key === 'Enter' || e.key === ',' || e.key === ';') {
                    e.preventDefault();
                    addChip();
                } else if (e.key === 'Backspace' && inputValue === '' && chips.length > 0) {
                    removeChip(chips.length - 1);
                }
            };

            const removeChip = (index) => {
                const newChips = chips.filter((_, i) => i !== index);
                onChange(newChips.join(';'));
            };

            return (
                <div className="flex flex-wrap items-center gap-2 p-2 border border-slate-300 rounded-xl bg-white focus-within:ring-2 focus-within:ring-brand-500 focus-within:border-brand-500 transition-shadow">
                    {icon && <i className={`ph ${icon} text-slate-400 ml-1`}></i>}
                    {chips.map((chip, idx) => (
                        <span key={idx} className="flex items-center gap-1 px-2.5 py-1 bg-slate-100 text-slate-700 text-sm font-medium rounded-lg border border-slate-200">
                            {chip}
                            <button type="button" onClick={() => removeChip(idx)} className="text-slate-400 hover:text-red-500 rounded-full p-0.5"><i className="ph ph-x text-xs"></i></button>
                        </span>
                    ))}
                    <input
                        type="text"
                        value={inputValue}
                        onChange={(e) => setInputValue(e.target.value)}
                        onKeyDown={handleKeyDown}
                        onBlur={addChip}
                        placeholder={chips.length === 0 ? placeholder : "Añadir otro..."}
                        className="flex-1 min-w-[120px] bg-transparent outline-none text-sm py-1 px-1"
                    />
                </div>
            );
        };

        const ModalWrapper = ({ isOpen, onClose, title, children, maxWidth = "max-w-xl", zIndex = "z-50" }) => {
            if (!isOpen) return null;
            return (
                <div className={`fixed inset-0 ${zIndex} flex items-center justify-center p-4 sm:p-6`}>
                    <div className="absolute inset-0 bg-slate-900/40 backdrop-blur-sm modal-overlay" onClick={onClose}></div>
                    <div className={`relative bg-white rounded-2xl shadow-2xl w-full ${maxWidth} max-h-full flex flex-col modal-content overflow-hidden`}>
                        {title && (
                            <div className="flex justify-between items-center p-5 border-b border-slate-100 bg-white z-10 sticky top-0">
                                <h2 className="text-xl font-bold text-slate-800">{title}</h2>
                                <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full text-slate-400 hover:bg-slate-100 hover:text-slate-700 transition-colors">
                                    <i className="ph ph-x text-lg"></i>
                                </button>
                            </div>
                        )}
                        <div className="overflow-y-auto flex-1 hide-scrollbar">
                            {children}
                        </div>
                    </div>
                </div>
            );
        };

        const getDriveImageUrl = (thumbnailId) => {
            if (!thumbnailId) return null;
            return `https://drive.google.com/thumbnail?id=${thumbnailId}&sz=w600`;
        };

        const getDirectDownloadLink = (link) => {
            if (!link) return '';
            if (link.includes('uc?export=')) return link;
            const match = link.match(/\/d\/(.+?)\//);
            if (match && match[1]) {
                return `https://drive.google.com/uc?export=download&id=${match[1]}`;
            }
            return link;
        };

        const parseStringArray = (str) => {
            if (!str) return [];
            return str.split(';').filter(Boolean).map(s => s.trim());
        };

        // --- FORMULARIOS ---

        const BookFormModal = ({ isOpen, onClose, initialData, onSave, isSaving }) => {
            const [formData, setFormData] = useState({ title: '', author: '', tags: '', description: '', thumbnailId: '' });
            const [image, setImage] = useState({ preview: null, file: null, base64: null, name: null });
            const fileInputRef = useRef(null);
            const showToast = useToast();

            useEffect(() => {
                if (isOpen) {
                    if (initialData) {
                        setFormData({
                            title: initialData.title || '',
                            author: initialData.author || '',
                            tags: initialData.tags || '',
                            description: initialData.description || '',
                            thumbnailId: initialData.thumbnailId || ''
                        });
                        setImage({ preview: getDriveImageUrl(initialData.thumbnailId), file: null, base64: null, name: null });
                    } else {
                        setFormData({ title: '', author: '', tags: '', description: '', thumbnailId: '' });
                        setImage({ preview: null, file: null, base64: null, name: null });
                    }
                }
            }, [isOpen, initialData]);

            const handleImageChange = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!file.type.match('image.*')) return showToast("Selecciona una imagen válida", "error");

                const reader = new FileReader();
                reader.onload = (ev) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let { width, height } = img;
                        const max = 400;
                        if (width > height) { if (width > max) { height *= max / width; width = max; } } 
                        else { if (height > max) { width *= max / height; height = max; } }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                        setImage({ preview: dataUrl, file, base64: dataUrl.split(',')[1], name: file.name });
                    };
                    img.src = ev.target.result;
                };
                reader.readAsDataURL(file);
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!formData.title) return showToast("El título es obligatorio", "error");
                
                const payload = { ...formData };
                if (initialData?.publication_id) payload.publication_id = initialData.publication_id;
                if (image.base64) {
                    payload.imageBase64 = image.base64;
                    payload.imageName = image.name;
                }
                onSave(payload);
            };

            return (
                <ModalWrapper isOpen={isOpen} onClose={onClose} title={initialData ? "Editar Libro" : "Añadir Libro"} zIndex="z-[60]">
                    <form onSubmit={handleSubmit} className="p-6 space-y-5">
                        <div className="flex flex-col items-center gap-3">
                            <div className="w-32 h-48 bg-slate-100 rounded-xl border-2 border-dashed border-slate-300 flex items-center justify-center overflow-hidden relative group cursor-pointer shadow-sm hover:border-brand-400 hover:bg-slate-50 transition-all" onClick={() => fileInputRef.current.click()}>
                                {image.preview ? (
                                    <img src={image.preview} className="w-full h-full object-cover" alt="Preview" />
                                ) : (
                                    <div className="text-center p-2">
                                        <i className="ph ph-image text-3xl text-slate-400 mb-1 block"></i>
                                        <span className="text-[10px] text-slate-500 uppercase tracking-wide font-semibold">Portada</span>
                                    </div>
                                )}
                                <div className="absolute inset-0 bg-black/50 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                                    <i className="ph ph-camera-plus text-white text-2xl"></i>
                                </div>
                            </div>
                            <input type="file" ref={fileInputRef} accept="image/*" className="hidden" onChange={handleImageChange} />
                        </div>

                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Título *</label>
                            <input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition-all" placeholder="Ej: Cien años de soledad" />
                        </div>
                        
                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Autor(es) *</label>
                            <ChipInput icon="ph-user" value={formData.author} onChange={val => setFormData({...formData, author: val})} placeholder="Escribe y presiona Enter..." />
                        </div>

                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Géneros / Tags *</label>
                            <ChipInput icon="ph-tag" value={formData.tags} onChange={val => setFormData({...formData, tags: val})} placeholder="Ej: Novela, Realismo Mágico..." />
                        </div>

                        <div>
                            <label className="block text-sm font-semibold text-slate-700 mb-1.5">Descripción</label>
                            <textarea rows="3" value={formData.description} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition-all resize-none" placeholder="Sinopsis breve..."></textarea>
                        </div>
                        
                        <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                            <button type="button" onClick={onClose} disabled={isSaving} className="px-5 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-medium transition-colors">Cancelar</button>
                            <button type="submit" disabled={isSaving} className="px-6 py-2.5 bg-brand-500 text-slate-900 rounded-xl font-bold hover:bg-brand-600 flex items-center gap-2 shadow-sm disabled:opacity-70 transition-colors">
                                {isSaving ? <><div className="loader border-t-slate-900 border-slate-900/30 w-4 h-4 border-2"></div> Guardando</> : 'Guardar Libro'}
                            </button>
                        </div>
                    </form>
                </ModalWrapper>
            );
        };

        const ItemFormModal = ({ isOpen, onClose, type, parentId, initialData, onSave, isSaving }) => {
            const [formData, setFormData] = useState({});
            
            useEffect(() => {
                if (isOpen) {
                    if (initialData) setFormData({ ...initialData });
                    else {
                        if (type === 'version') setFormData({ language: 'Español', format: 'PDF', file_drive_link: '', isbn: '', publication_date: '' });
                        else setFormData({ material_type: 'other', material_title: '', link: '', description: '' });
                    }
                }
            }, [isOpen, initialData, type]);

            const handleSubmit = (e) => {
                e.preventDefault();
                onSave({ ...formData, publication_id: parentId });
            };

            const isV = type === 'version';

            return (
                <ModalWrapper isOpen={isOpen} onClose={onClose} title={initialData ? `Editar ${isV ? 'Versión' : 'Material'}` : `Añadir ${isV ? 'Versión' : 'Material'}`} zIndex="z-[60]">
                    <form onSubmit={handleSubmit} className="p-6 space-y-4">
                        {isV ? (
                            <>
                                <div className="grid grid-cols-2 gap-4">
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Idioma *</label>
                                        <select value={formData.language || 'Español'} onChange={e => setFormData({...formData, language: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                                            <option value="Español">Español</option><option value="Inglés">Inglés</option>
                                            <option value="Francés">Francés</option><option value="Otros">Otros</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Formato *</label>
                                        <select value={formData.format || 'PDF'} onChange={e => setFormData({...formData, format: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                                            <option value="PDF">PDF</option><option value="EPUB">EPUB</option>
                                            <option value="MOBI">MOBI</option><option value="Físico">Físico</option>
                                        </select>
                                    </div>
                                </div>
                                <div className="p-4 bg-blue-50 border border-blue-100 rounded-xl">
                                    <label className="block text-sm font-bold text-blue-900 mb-1.5">ISBN <span className="font-normal text-blue-700">(Opcional pero recomendado)</span></label>
                                    <input type="text" value={formData.isbn || ''} onChange={e => setFormData({...formData, isbn: e.target.value})} className="w-full px-4 py-2 bg-white border border-blue-200 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none font-mono text-sm" placeholder="Ej: 978-84-376-0494-7" />
                                </div>
                                <div className="grid grid-cols-2 gap-4">
                                    <div className="col-span-2 sm:col-span-1">
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Año/Fecha Edición</label>
                                        <input type="text" value={formData.publication_date || ''} onChange={e => setFormData({...formData, publication_date: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Ej: 2024" />
                                    </div>
                                    <div className="col-span-2 sm:col-span-1">
                                        <label className="block text-sm font-semibold text-slate-700 mb-1.5">Enlace Drive *</label>
                                        <input type="url" required value={formData.file_drive_link || ''} onChange={e => setFormData({...formData, file_drive_link: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="https://drive..." />
                                    </div>
                                </div>
                            </>
                        ) : (
                            <>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Tipo *</label>
                                    <select value={formData.material_type || 'other'} onChange={e => setFormData({...formData, material_type: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none">
                                        <option value="md_zip">Notas (Markdown ZIP)</option><option value="txt_zip">Notas (TXT ZIP)</option>
                                        <option value="audio_drive_folder">Carpeta Audio (Drive)</option><option value="notion_link">Notion/Web</option>
                                        <option value="other">Otro</option>
                                    </select>
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Título *</label>
                                    <input type="text" required value={formData.material_title || ''} onChange={e => setFormData({...formData, material_title: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Ej: Notas Capítulo 1" />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Enlace *</label>
                                    <input type="url" required value={formData.link || ''} onChange={e => setFormData({...formData, link: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="URL..." />
                                </div>
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1.5">Descripción</label>
                                    <input type="text" value={formData.description || ''} onChange={e => setFormData({...formData, description: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" />
                                </div>
                            </>
                        )}
                        <div className="pt-4 flex justify-end gap-3 border-t border-slate-100">
                            <button type="button" onClick={onClose} disabled={isSaving} className="px-5 py-2.5 text-slate-600 hover:bg-slate-100 rounded-xl font-medium">Cancelar</button>
                            <button type="submit" disabled={isSaving} className="px-6 py-2.5 bg-brand-500 text-slate-900 rounded-xl font-bold hover:bg-brand-600 flex items-center gap-2 transition-colors">
                                {isSaving ? <div className="loader border-t-slate-900 border-slate-900/30 w-4 h-4 border-2"></div> : 'Guardar'}
                            </button>
                        </div>
                    </form>
                </ModalWrapper>
            );
        };

        const ProjectFormModal = ({ isOpen, onClose, initialData, onSave, isSaving, allPublications }) => {
            const [formData, setFormData] = useState({ title: '', description: '', publication_ids: [] });
            const [bookSearch, setBookSearch] = useState('');
            
            useEffect(() => {
                if (isOpen) {
                    if (initialData) {
                        setFormData({
                            title: initialData.title || '',
                            description: initialData.description || '',
                            publication_ids: initialData.publication_ids ? initialData.publication_ids.split(',').filter(Boolean) : []
                        });
                    } else {
                        setFormData({ title: '', description: '', publication_ids: [] });
                    }
                    setBookSearch('');
                }
            }, [isOpen, initialData]);

            const toggleBook = (id) => {
                setFormData(prev => ({
                    ...prev,
                    publication_ids: prev.publication_ids.includes(id) 
                        ? prev.publication_ids.filter(pid => pid !== id)
                        : [...prev.publication_ids, id]
                }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                if(!formData.title) return;
                const payload = { 
                    ...formData, 
                    publication_ids: formData.publication_ids.join(',') 
                };
                if(initialData?.project_id) payload.project_id = initialData.project_id;
                onSave(payload);
            };

            const filteredBooks = useMemo(() => {
                let filtered = allPublications;
                if (bookSearch.trim()) {
                    const q = bookSearch.toLowerCase();
                    filtered = filtered.filter(p => (p.title||'').toLowerCase().includes(q) || (p.author||'').toLowerCase().includes(q));
                }
                return filtered.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            }, [allPublications, bookSearch]);

            return (
                <ModalWrapper isOpen={isOpen} onClose={onClose} title={initialData ? "Editar Proyecto" : "Crear Proyecto"} maxWidth="max-w-4xl" zIndex="z-[60]">
                    <form onSubmit={handleSubmit} className="p-6 flex flex-col h-[80vh]">
                        <div className="space-y-4 mb-6 shrink-0">
                            <div>
                                <label className="block text-sm font-semibold text-slate-700 mb-1.5">Nombre del Proyecto / Colección *</label>
                                <input type="text" required value={formData.title} onChange={e => setFormData({...formData, title: e.target.value})} className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-brand-500 outline-none" placeholder="Ej: Bibliografía Semestre 2027-1" />
                            </div>
                            <div>

        const App = () => {
            // Estados principales
            const [view, setView] = useState('library'); // 'library' | 'projects'
            const [data, setData] = useState({ publications: [], versions: [], materials: [], projects: [] });
            const [isLoading, setIsLoading] = useState(true);
            const showToast = useToast();

            // Filtros y Búsqueda
            const [search, setSearch] = useState('');
            const [selectedTags, setSelectedTags] = useState([]);
            const [activeProject, setActiveProject] = useState(null);
            const [showTags, setShowTags] = useState(false);

            // Estados Modales
            const [bookForm, setBookForm] = useState({ open: false, data: null, saving: false });
            const [projectForm, setProjectForm] = useState({ open: false, data: null, saving: false });
            const [itemForm, setItemForm] = useState({ open: false, type: 'version', parentId: null, data: null, saving: false });
            const [detailModal, setDetailModal] = useState({ open: false, id: null });

            // Carga inicial
            useEffect(() => { fetchData(); }, []);

            const fetchData = async () => {
                setIsLoading(true);
                try {
                    const res = await fetch(API_URL, {
                        method: 'POST',
                        body: JSON.stringify({ action: 'getAllData', token: API_TOKEN })
                    });
                    const json = await res.json();
                    if (json.status === 'error') throw new Error(json.message);
                    setData({
                        publications: json.data.publications || [],
                        versions: json.data.versions || [],
                        materials: json.data.materials || [],
                        projects: json.data.projects || []
                    });
                } catch (error) {
                    showToast(error.message, 'error');
                } finally {
                    setIsLoading(false);
                }
            };

            // Helpers API Genéricos
            const apiCall = async (action, payload = {}) => {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, token: API_TOKEN, ...payload })
                });
                const json = await res.json();
                if (json.status === 'error') throw new Error(json.message);
                return json.data;
            };

            // --- Lógica de Libros ---
            const handleSaveBook = async (payload) => {
                setBookForm(prev => ({...prev, saving: true}));
                try {
                    const action = payload.publication_id ? 'updatePublication' : 'createPublication';
                    await apiCall(action, { data: payload });
                    showToast("Libro guardado con éxito", "success");
                    setBookForm({ open: false, data: null, saving: false });
                    fetchData();
                } catch(e) { showToast(e.message, 'error'); setBookForm(prev => ({...prev, saving: false})); }
            };

            const handleDeleteBook = async (id) => {
                if(!confirm("¿Eliminar este libro y todo su contenido?")) return;
                setDetailModal({ open: false, id: null });
                try {
                    await apiCall('deletePublication', { id });
                    showToast("Libro eliminado", "success");
                    fetchData();
                } catch(e) { showToast(e.message, 'error'); }
            };

            // --- Lógica de Proyectos ---
            const handleSaveProject = async (payload) => {
                setProjectForm(prev => ({...prev, saving: true}));
                try {
                    const action = payload.project_id ? 'updateProject' : 'createProject';
                    await apiCall(action, { data: payload });
                    showToast("Proyecto guardado", "success");
                    setProjectForm({ open: false, data: null, saving: false });
                    fetchData();
                } catch(e) { showToast(e.message, 'error'); setProjectForm(prev => ({...prev, saving: false})); }
            };

            const handleDeleteProject = async (id) => {
                if(!confirm("¿Eliminar este proyecto? (Los libros no se borrarán)")) return;
                setActiveProject(null);
                try {
                    await apiCall('deleteProject', { id });
                    showToast("Proyecto eliminado", "success");
                    fetchData();
                } catch(e) { showToast(e.message, 'error'); }
            };

            // --- Lógica de Items (Versiones/Materiales) ---
            const handleSaveItem = async (payload) => {
                setItemForm(prev => ({...prev, saving: true}));
                const isV = itemForm.type === 'version';
                const actionName = itemForm.data ? `update${isV?'Version':'Material'}` : `create${isV?'Version':'Material'}`;
                try {
                    await apiCall(actionName, { data: payload });
                    showToast("Guardado correctamente", "success");
                    setItemForm({ open: false, type: 'version', parentId: null, data: null, saving: false });
                    fetchData();
                } catch(e) { showToast(e.message, 'error'); setItemForm(prev => ({...prev, saving: false})); }
            };

            const handleDeleteItem = async (type, id) => {
                if(!confirm("¿Eliminar este elemento?")) return;
                try {
                    await apiCall(type === 'version' ? 'deleteVersion' : 'deleteMaterial', { id });
                    showToast("Eliminado", "success");
                    fetchData();
                } catch(e) { showToast(e.message, 'error'); }
            };

            // --- Filtrado Inteligente ---
            const allAvailableTags = useMemo(() => {
                const tagSet = new Set();
                data.publications.forEach(p => { parseStringArray(p.tags).forEach(t => tagSet.add(t)); });
                return Array.from(tagSet).sort();
            }, [data.publications]);

            const filteredPublications = useMemo(() => {
                let list = data.publications;
                
                // Si estamos dentro de un proyecto, filtrar primero por esos IDs

                    const pIds = activeProject.publication_ids ? activeProject.publication_ids.split(',') : [];
                    list = list.filter(p => pIds.includes(p.publication_id));
                }

                // Filtro por Búsqueda (Título o Autores)
                if (search.trim()) {
                    const q = search.toLowerCase();
                    list = list.filter(p => (p.title||'').toLowerCase().includes(q) || (p.author||'').toLowerCase().includes(q));
                }

                // Filtro por Tags (Debe incluir todos los tags seleccionados - AND logic)
                if (selectedTags.length > 0) {
                    list = list.filter(p => {
                        const pTags = parseStringArray(p.tags);
                        return selectedTags.every(st => pTags.includes(st));
                    });
                }

                return list;

                                    </button>
                                ) : (
                                    <button onClick={() => setProjectForm({ open: true, data: null, saving: false })} className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-sm font-semibold transition-all flex items-center gap-2 shadow-sm transform hover:scale-105">

                        ) : null}

                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 h-full flex flex-col">
                            
                            {/* VISTA: LIBRERÍA O DENTRO DE UN PROYECTO */}
                            {(view === 'library' || activeProject) && (
                                <div className="flex-1 flex flex-col">
                                    {/* Project Banner if active */}
                                    {activeProject && (
                                        <div className="mb-6 p-6 bg-white border border-slate-200 rounded-2xl shadow-sm relative overflow-hidden group">
                                            <div className="absolute top-0 left-0 w-1.5 h-full bg-brand-500"></div>
                                            <div className="flex justify-between items-start">
                                                <div>
                                                    <button onClick={() => { setActiveProject(null); setView('projects'); }} className="text-slate-400 hover:text-brand-600 text-sm font-medium flex items-center gap-1 mb-2 transition-colors"><i className="ph ph-arrow-left"></i> Volver a proyectos</button>
                                                    <h2 className="text-3xl font-black text-slate-900 mb-1">{activeProject.title}</h2>
                                                    {activeProject.description && <p className="text-slate-500 max-w-2xl">{activeProject.description}</p>}
                                                </div>
                                                <div className="flex gap-2">
                                                    <button onClick={() => setProjectForm({ open: true, data: activeProject, saving: false })} className="p-2 text-slate-400 hover:text-slate-700 bg-slate-50 hover:bg-slate-100 rounded-lg transition-colors"><i className="ph ph-pencil-simple text-lg"></i></button>
                                                    <button onClick={() => handleDeleteProject(activeProject.project_id)} className="p-2 text-slate-400 hover:text-red-500 bg-slate-50 hover:bg-red-50 rounded-lg transition-colors"><i className="ph ph-trash text-lg"></i></button>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {/* Toolbar (Search & Tags) */}
                                    <div className="flex flex-col md:flex-row gap-4 mb-6 shrink-0">
                                        <div className="relative flex-1">
                                            <i className="ph ph-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 text-xl"></i>
                                            <input type="text" value={search} onChange={e => setSearch(e.target.value)} placeholder="Buscar por título o autor..." className="w-full pl-12 pr-4 py-3 bg-white border border-slate-200 rounded-2xl focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition-shadow shadow-sm font-medium" />
                                        </div>
                                        <button onClick={() => setShowTags(!showTags)} className={`px-5 py-3 rounded-2xl font-bold flex items-center gap-2 transition-all border shadow-sm ${showTags ? 'bg-brand-500 text-slate-900 border-brand-600' : 'bg-white text-slate-700 border-slate-200 hover:border-brand-300 hover:bg-slate-50'}`}>
                                            <i className="ph ph-compass text-xl"></i> Explorar
                                        </button>
                                    </div>

                                    {/* Tag Cloud */}
                                    {showTags && allAvailableTags.length > 0 && (
                                        <div className="flex flex-wrap gap-2 mb-8 shrink-0 bg-white p-5 rounded-2xl border border-slate-200 shadow-sm transition-all animate-[fadeIn_0.2s_ease-out]">
                                            <div className="w-full mb-2 text-sm font-bold text-slate-500 flex items-center gap-2"><i className="ph ph-tag"></i> Filtrar por géneros / etiquetas:</div>
                                            {allAvailableTags.map(tag => {
                                                const isActive = selectedTags.includes(tag);
                                                return (
                                                    <button key={tag} onClick={() => setSelectedTags(prev => isActive ? prev.filter(t => t !== tag) : [...prev, tag])}
                                                        className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all border ${isActive ? 'bg-brand-500 text-slate-900 border-brand-600 shadow-md transform scale-105' : 'bg-slate-50 text-slate-600 border-slate-200 hover:border-brand-300 hover:bg-brand-50'}`}>
                                                        {tag}
                                                    </button>
                                                )
                                            })}
                                            {selectedTags.length > 0 && (
                                                <button onClick={() => setSelectedTags([])} className="px-3 py-1.5 rounded-lg text-sm font-semibold text-slate-400 hover:text-slate-600 underline ml-2">Limpiar filtros</button>
                                            )}
                                        </div>
                                    )}

                                    {/* Grid */}
                                    {filteredPublications.length === 0 ? (
                                        <div className="flex-1 flex flex-col items-center justify-center text-center py-20">
                                            <i className="ph ph-books text-6xl text-slate-300 mb-4 block"></i>
                                            <h3 className="text-xl font-bold text-slate-800 mb-2">No se encontraron libros</h3>
                                            <p className="text-slate-500 max-w-md mx-auto">Ajusta tu búsqueda, remueve los filtros o añade nuevos libros a tu colección.</p>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 sm:gap-6 pb-10">
                                            {filteredPublications.map(pub => {
                                                const imgUrl = getDriveImageUrl(pub.thumbnailId);
                                                const imgSrc = imgUrl || `https://ui-avatars.com/api/?name=${encodeURIComponent(pub.title)}&background=f1f5f9&color=64748b&size=400&font-size=0.3`;
                                                return (
                                                    <div key={pub.publication_id} onClick={() => setDetailModal({ open: true, id: pub.publication_id })} className="bg-slate-200 rounded-xl shadow-sm border border-slate-100 overflow-hidden hover:shadow-2xl hover:border-brand-300 transition-all duration-300 cursor-pointer relative group aspect-[2/3] transform hover:-translate-y-1">
                                                        <img src={imgSrc} className="w-full h-full object-cover" alt={pub.title} onError={(e) => { e.target.onerror = null; e.target.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(pub.title)}&background=f87171&color=fff`; }} />
                                                        <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex flex-col justify-end p-4">
                                                            <h4 className="text-white font-bold leading-tight mb-1 truncate">{pub.title}</h4>
                                                            <p className="text-slate-200 text-xs truncate">{parseStringArray(pub.author).join(', ')}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* VISTA: PROYECTOS (Listado) */}
                            {view === 'projects' && !activeProject && (
                                <div className="flex-1">
                                    <div className="flex justify-between items-center mb-8">
                                        <div>
                                            <h2 className="text-3xl font-black text-slate-900 mb-2">Proyectos & Colecciones</h2>
                                            <p className="text-slate-500 font-medium">Agrupa tu bibliografía por semestres, investigaciones o temáticas.</p>
                                        </div>
                                    </div>

                                    {data.projects.length === 0 ? (
                                        <div className="text-center py-20 border-2 border-dashed border-slate-200 rounded-3xl bg-white">
                                            <i className="ph ph-folders text-6xl text-slate-300 mb-4 block"></i>
                                            <h3 className="text-xl font-bold text-slate-800 mb-2">Aún no tienes proyectos</h3>
                                            <p className="text-slate-500 mb-6 max-w-md mx-auto">Crea una colección para organizar los libros específicos para un semestre académico o un área de estudio.</p>
                                            <button onClick={() => setProjectForm({ open: true, data: null, saving: false })} className="bg-slate-800 hover:bg-slate-900 text-white px-6 py-3 rounded-xl font-semibold shadow-sm transition-all"><i className="ph ph-plus-circle mr-2"></i>Crear Primer Proyecto</button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                            {data.projects.map(proj => {
                                                const bookCount = proj.publication_ids ? proj.publication_ids.split(',').filter(Boolean).length : 0;
                                                return (
                                                    <div key={proj.project_id} onClick={() => setActiveProject(proj)} className="bg-white border border-slate-200 rounded-2xl p-6 hover:shadow-xl hover:border-brand-400 transition-all cursor-pointer group relative overflow-hidden">
                                                        <div className="absolute top-0 right-0 w-24 h-24 bg-gradient-to-bl from-slate-100 to-transparent rounded-bl-full opacity-50 group-hover:from-brand-50 transition-colors"></div>
                                                        <div className="flex items-center gap-3 mb-4">
                                                            <div className="w-12 h-12 rounded-xl bg-slate-800 text-white flex items-center justify-center shrink-0 shadow-md group-hover:bg-brand-600 transition-colors">
                                                                <i className="ph ph-folder-open text-2xl"></i>
                                                            </div>
                                                            <div>
                                                                <h3 className="font-bold text-lg text-slate-900 leading-tight">{proj.title}</h3>
                                                                <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">{bookCount} {bookCount===1?'Libro':'Libros'}</span>
                                                            </div>
                                                        </div>
                                                        <p className="text-sm text-slate-500 line-clamp-2 leading-relaxed">{proj.description || 'Sin descripción.'}</p>
                                                        <div className="mt-5 pt-4 border-t border-slate-100 flex justify-end">
                                                            <span className="text-sm font-semibold text-brand-600 group-hover:text-brand-700 flex items-center gap-1">Explorar <i className="ph ph-arrow-right"></i></span>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                        </div>
                    </main>

                    {/* MODALES MONTADOS DINÁMICAMENTE */}
                    <BookFormModal isOpen={bookForm.open} initialData={bookForm.data} isSaving={bookForm.saving}
                        onClose={() => setBookForm({ open: false, data: null, saving: false })} onSave={handleSaveBook} />
                    
                    <ProjectFormModal isOpen={projectForm.open} initialData={projectForm.data} isSaving={projectForm.saving} allPublications={data.publications}
                        onClose={() => setProjectForm({ open: false, data: null, saving: false })} onSave={handleSaveProject} />
                    
                    <ItemFormModal isOpen={itemForm.open} type={itemForm.type} parentId={itemForm.parentId} initialData={itemForm.data} isSaving={itemForm.saving}
                        onClose={() => setItemForm({ open: false, type: 'version', parentId: null, data: null, saving: false })} onSave={handleSaveItem} />
                    
                    <BookDetailModal 
                        isOpen={detailModal.open} 
                        book={data.publications.find(p => p.publication_id === detailModal.id)}
                        versions={data.versions.filter(v => v.publication_id === detailModal.id)}
                        materials={data.materials.filter(m => m.publication_id === detailModal.id)}
                        onClose={() => setDetailModal({ open: false, id: null })}
                        onEdit={(b) => setBookForm({ open: true, data: b, saving: false })}
                        onDelete={handleDeleteBook}
                        onOpenItemForm={(type, initial, parentId) => setItemForm({ open: true, type, data: initial, parentId, saving: false })}
                        onDeleteItem={handleDeleteItem}
                    />
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <ToastProvider>
                <App />
            </ToastProvider>
        );
    </script>
</body>
</html>
